# Example blocking rules for the DPI engine.
#
#   dpi_engine input.pcap output.pcap --rules examples/rules.conf
#
# Format: INI-style sections, one rule per line.
# Blank lines are ignored; '#' starts a comment and may follow a rule.
# Unparseable entries are reported on stderr and skipped, not fatal.

# ---------------------------------------------------------------------------
# Applications, matched against the classification of the flow.
# Use the exact names the engine prints in its report, e.g. YouTube, Facebook,
# Instagram, TikTok, Netflix, Spotify, Discord, Telegram, Zoom, GitHub.
# ---------------------------------------------------------------------------
[BLOCKED_APPS]
YouTube
TikTok

# ---------------------------------------------------------------------------
# Domains, matched against the TLS SNI or the HTTP Host header.
#
# A bare domain is an EXACT match: "facebook.com" does NOT match
# "www.facebook.com". Use the wildcard form to include subdomains --
# "*.facebook.com" matches www.facebook.com, cdn.facebook.com and the bare
# facebook.com. Matching is case-insensitive.
# ---------------------------------------------------------------------------
[BLOCKED_DOMAINS]
*.facebook.com
*.instagram.com

# ---------------------------------------------------------------------------
# Source IPv4 addresses, in dotted-quad form.
# ---------------------------------------------------------------------------
[BLOCKED_IPS]
192.168.1.50

# ---------------------------------------------------------------------------
# Destination TCP/UDP ports.
# ---------------------------------------------------------------------------
[BLOCKED_PORTS]
8080
